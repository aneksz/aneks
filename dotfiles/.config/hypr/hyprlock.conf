source = $HOME/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

general {
  hide_cursor = false
}

background {
  monitor =
  path = $HOME/.config/hypr/background/current.png
  color = $bg0
  blur_size = 10
  blur_passes = 3
}

# TIME
label {
  monitor = DP-1
  text = $TIME
  color = $fg1
  font_size = 130
  font_family = $font
  position = 0, -50
  halign = center
  valign = top
}

# DATE
label {
  monitor = DP-1
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $fg1
  font_size = 34
  font_family = $font
  position = 0, -250
  halign = center
  valign = top
}

# SPOTIFY INFO (Artist - Song)
label {
  monitor = DP-1
  # Update your script to ONLY return "Artist - Title" or use the command directly:
  text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock/spotify.sh)"
  color = $info
  font_family = $font
  font_weight = bold
  font_size = 16
  position = 0, -120
  halign = center
  valign = center
}

# PREVIOUS
label {
    monitor = DP-1
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock/spotify.sh prev
    color = $info
    font_size = 28
    font_family = $font
    font_weight = bold

    width = 100
    text_align = center

    position = -90, -180
    halign = center
    valign = center

    onclick = playerctl previous -p spotify
}

# PLAY-PAUSE
label {
    monitor = DP-1
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock/spotify.sh playpause
    color = $info
    font_size = 28
    font_family = $font
    font_weight = bold

    width = 100
    text_align = center

    position = 0, -181
    halign = center
    valign = center

    onclick = playerctl play-pause -p spotify
}

# NEXT
label {
    monitor = DP-1
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock/spotify.sh next
    color = $info
    font_size = 28
    font_family = $font
    font_weight = bold

    width = 100
    text_align = center

    position = 90, -180
    halign = center
    valign = center

    onclick = playerctl next -p spotify
}


# AVATAR
image {
  monitor = DP-1
  path = $HOME/.config/hypr/background/avatar1.png 
  size = 180
  rounding = -1        
  border_size = 2
  border_color = $accent
  position = 0, 200
  halign = center
  valign = center
}


# GREETING
label {
  monitor = DP-1
  text = cmd[update:60000] echo "<i><b> Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning; elif [ $H -lt 18 ]; then echo Afternoon; else echo Evening; fi) $(echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]')$(echo "${USER:1}" | tr '[:upper:]' '[:lower:]') </b></i>"
  color = $fg0
  font_family = $font
  font_size = 16
  position = 0, 340
  halign = center
  valign = center
}

# INPUT
input-field {
  monitor = DP-1
  size = 300, 60
  outline_thickness = 4
  fade_on_empty = false
  outer_color = $accent
  inner_color = $bg1
  font_color = $fg0

  fail_color = $error
  capslock_color = $warn

  placeholder_text = <i>󰌾  Logged in as </i>$USER

  position = 0, 40
  halign = center
  valign = center
}